name: macOS build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    # Explicit Intel pool avoids the macOS arm64 capacity queue.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test -j 1
      - name: Build native app
        run: ./scripts/build.sh release
      - name: Verify signature
        run: |
          codesign --verify --deep --strict dist/Reeeead.app
          test -f dist/Reeeead.app/Contents/Resources/Reeeead_Reeeead.bundle/Fonts/OpenDyslexic-Regular.otf
          test -f dist/Reeeead.app/Contents/Resources/Reeeead_Reeeead.bundle/Fonts/OFL.txt
          test -f dist/Reeeead.app/Contents/Resources/Reeeead_Reeeead.bundle/Brand/wordmark.png
          test -f dist/Reeeead.app/Contents/Resources/Reeeead_Reeeead.bundle/Localization/en.lproj/Localizable.strings
          test -f dist/Reeeead.app/Contents/Resources/Reeeead_Reeeead.bundle/Localization/zh-Hans.lproj/Localizable.strings
      - uses: actions/upload-artifact@v4
        with:
          name: Reeeead-macOS-x86_64-unsigned-for-distribution
          path: dist/Reeeead.app
